<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EliteUniteTime{% endblock %} | داشبورد</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0b0d12;
      --bg-elevated:  #12151c;
      --surface:      #181c26;
      --surface2:     #1f2433;
      --surface3:     #262b3d;
      --border:       #2a3044;
      --border-light: #343b52;
      --accent:       #6366f1;
      --accent-hover: #818cf8;
      --accent-soft:  rgba(99, 102, 241, 0.12);
      --green:        #10b981;
      --green-soft:   rgba(16, 185, 129, 0.12);
      --red:          #f43f5e;
      --red-soft:     rgba(244, 63, 94, 0.12);
      --yellow:       #f59e0b;
      --yellow-soft:  rgba(245, 158, 11, 0.12);
      --blue:         #3b82f6;
      --blue-soft:    rgba(59, 130, 246, 0.12);
      --purple:       #a78bfa;
      --purple-soft:  rgba(167, 139, 250, 0.12);
      --text:         #f1f5f9;
      --text-secondary: #cbd5e1;
      --muted:        #94a3b8;
      --radius-sm:    8px;
      --radius:       12px;
      --radius-lg:    16px;
      --shadow:       0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25);
      --sidebar-w:    252px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 100% -10%, rgba(99,102,241,.08), transparent),
        radial-gradient(ellipse 60% 40% at 0% 100%, rgba(16,185,129,.05), transparent);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    a { color: inherit; }

    /* ── Layout ── */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 200;
    }

    .sidebar-brand {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(99,102,241,.35);
    }

    .brand-text h1 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .brand-text span {
      font-size: .72rem;
      color: var(--muted);
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-label {
      font-size: .68rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 8px 12px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      color: var(--muted);
      text-decoration: none;
      font-size: .88rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      transition: background .15s, color .15s;
    }

    .nav-item:hover {
      color: var(--text);
      background: var(--surface2);
    }

    .nav-item.active {
      color: var(--text);
      background: var(--accent-soft);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .nav-item .icon {
      width: 20px;
      text-align: center;
      font-size: 1rem;
      opacity: .9;
    }

    .sidebar-footer {
      padding: 16px 12px 20px;
      border-top: 1px solid var(--border);
    }

    .logout-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: var(--red-soft);
      color: var(--red);
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-size: .85rem;
      font-weight: 600;
      transition: background .15s;
    }

    .logout-btn:hover { background: rgba(244, 63, 94, .2); }

    .main {
      margin-right: var(--sidebar-w);
      flex: 1;
      min-width: 0;
      padding: 28px 32px 40px;
    }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .page-header h2 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-header p {
      color: var(--muted);
      font-size: .88rem;
      margin-top: 4px;
    }

    .page-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: .78rem;
      color: var(--muted);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.85); }
    }

    /* ── Toolbar & grids ── */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    .grid-stats-inline {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 0;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-body { padding: 20px 22px; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .card-title {
      font-size: .92rem;
      font-weight: 600;
      color: var(--text);
    }

    .card-subtitle {
      font-size: .78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color .15s;
    }

    .stat-card:hover { border-color: var(--border-light); }

    .stat-card .label {
      font-size: .78rem;
      color: var(--muted);
      font-weight: 500;
    }

    .stat-card .value {
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -.02em;
    }

    .stat-card .sub {
      font-size: .72rem;
      color: var(--muted);
    }

    .stat-card.compact { padding: 14px 18px; }
    .stat-card.compact .value { font-size: 1.45rem; }

    .stat-card.green  .value { color: var(--green); }
    .stat-card.red    .value { color: var(--red); }
    .stat-card.blue   .value { color: var(--blue); }
    .stat-card.purple .value { color: var(--purple); }
    .stat-card.yellow .value { color: var(--yellow); }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .86rem;
    }

    thead th {
      background: var(--surface2);
      color: var(--muted);
      font-weight: 600;
      font-size: .78rem;
      padding: 12px 18px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,.02); }

    tbody td {
      padding: 13px 18px;
      color: var(--text-secondary);
      vertical-align: middle;
    }

    tbody td strong { color: var(--text); font-weight: 600; }

    .cell-muted { color: var(--muted) !important; font-size: .8rem; }
    .cell-ltr { direction: ltr; text-align: right; }
    .cell-truncate {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cell-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-green  { background: var(--green-soft);  color: var(--green); }
    .badge-red    { background: var(--red-soft);    color: var(--red); }
    .badge-yellow { background: var(--yellow-soft); color: var(--yellow); }
    .badge-blue   { background: var(--blue-soft);  color: var(--blue); }

    /* ── Chips (missing users etc.) ── */
    .chip-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: .86rem;
      color: var(--text-secondary);
    }

    .chip-danger {
      background: var(--red-soft);
      border-color: rgba(244, 63, 94, .2);
    }

    .chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .chip-dot.red { background: var(--red); }

    /* ── Forms & filters ── */
    .filters {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 140px;
    }

    .filter-group label {
      font-size: .76rem;
      font-weight: 500;
      color: var(--muted);
    }

    .filter-group input,
    .filter-group select {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-family: inherit;
      font-size: .85rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      min-height: 38px;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .form-card .card-body { padding-top: 18px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: .84rem;
      font-weight: 600;
      text-decoration: none;
      transition: background .15s, opacity .15s, transform .1s;
      white-space: nowrap;
      min-height: 38px;
    }

    .btn:active { transform: scale(.98); }
    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-primary:hover  { background: var(--accent-hover); }
    .btn-success  { background: var(--green); color: #fff; }
    .btn-success:hover  { opacity: .9; }
    .btn-danger   { background: var(--red); color: #fff; }
    .btn-danger:hover   { opacity: .9; }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--surface3); }
    .btn-sm { padding: 5px 11px; font-size: .76rem; min-height: 30px; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 40px 24px;
      color: var(--muted);
    }

    .empty .icon {
      font-size: 2.2rem;
      margin-bottom: 10px;
      opacity: .7;
    }

    .empty div:last-child { font-size: .88rem; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-light);
      border-radius: 4px;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(100%);
        transition: transform .25s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .main {
        margin-right: 0;
        padding: 20px 16px 32px;
      }
      .mobile-topbar {
        display: flex !important;
      }
    }

    .mobile-topbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .menu-toggle {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 150;
    }

    .sidebar-overlay.show { display: block; }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: .88rem;
    }
    .alert-ok {
      background: var(--green-soft);
      border: 1px solid rgba(16, 185, 129, .25);
      color: var(--green);
    }
    .alert-error {
      background: var(--red-soft);
      border: 1px solid rgba(244, 63, 94, .25);
      color: var(--red);
    }
    .alert-info {
      background: var(--accent-soft);
      border: 1px solid rgba(99, 102, 241, .25);
      color: var(--accent-hover);
    }
    .payment-info {
      font-size: .82rem;
      color: var(--muted);
      margin-top: 4px;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="app-shell">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <h1>EliteUniteTime</h1>
          <span>پنل مدیریت تیم</span>
        </div>
      </div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-label">منوی اصلی</div>
      <a href="{{ url_for('index') }}"
         class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
        <span class="icon">🏠</span> داشبورد
      </a>
      <a href="{{ url_for('users') }}"
         class="nav-item {% if request.endpoint == 'users' %}active{% endif %}">
        <span class="icon">👥</span> کاربران
      </a>
      <a href="{{ url_for('reports') }}"
         class="nav-item {% if request.endpoint == 'reports' %}active{% endif %}">
        <span class="icon">📊</span> گزارش‌ها
      </a>
      <a href="{{ url_for('penalties') }}"
         class="nav-item {% if request.endpoint == 'penalties' %}active{% endif %}">
        <span class="icon">⚠️</span> جریمه‌ها
      </a>
      <a href="{{ url_for('analytics') }}"
         class="nav-item {% if request.endpoint == 'analytics' %}active{% endif %}">
        <span class="icon">📈</span> نمودارها
      </a>
    </div>

    <div class="sidebar-footer">
      <a href="{{ url_for('logout') }}" class="logout-btn">خروج از پنل</a>
    </div>
  </nav>

  <main class="main">
    <div class="mobile-topbar">
      <button type="button" class="menu-toggle" onclick="openSidebar()">☰ منو</button>
      <span class="page-meta">EliteUniteTime</span>
    </div>
    {% block content %}{% endblock %}
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('show');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
