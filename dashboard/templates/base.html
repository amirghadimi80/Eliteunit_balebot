<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EliteUniteTime{% endblock %} | داشبورد</title>

  <!-- Vazirmatn font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #22263a;
      --border:    #2e3250;
      --accent:    #6c63ff;
      --accent2:   #a78bfa;
      --green:     #22c55e;
      --red:       #ef4444;
      --yellow:    #f59e0b;
      --blue:      #3b82f6;
      --text:      #e2e8f0;
      --muted:     #8892b0;
      --radius:    12px;
      --shadow:    0 4px 24px rgba(0,0,0,.4);
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px;
      min-height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 0;
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 100;
    }

    .sidebar-logo {
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .sidebar-logo h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent2);
      line-height: 1.3;
    }

    .sidebar-logo span {
      font-size: .75rem;
      color: var(--muted);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 24px;
      color: var(--muted);
      text-decoration: none;
      font-size: .9rem;
      border-right: 3px solid transparent;
      transition: all .2s;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text);
      background: var(--surface2);
      border-right-color: var(--accent);
    }

    .nav-item .icon { font-size: 1.1rem; }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
    }

    .logout-btn {
      display: block;
      text-align: center;
      padding: 8px;
      background: rgba(239,68,68,.15);
      color: var(--red);
      border-radius: 8px;
      text-decoration: none;
      font-size: .85rem;
      transition: background .2s;
    }

    .logout-btn:hover { background: rgba(239,68,68,.3); }

    /* ── Main content ── */
    .main {
      margin-right: 240px;
      flex: 1;
      padding: 32px;
      min-height: 100vh;
    }

    .page-header {
      margin-bottom: 28px;
    }

    .page-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .page-header p {
      color: var(--muted);
      font-size: .9rem;
      margin-top: 4px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: .85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
    }

    /* ── Stat cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-card .label {
      font-size: .8rem;
      color: var(--muted);
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }

    .stat-card .sub {
      font-size: .78rem;
      color: var(--muted);
    }

    .stat-card.green .value { color: var(--green); }
    .stat-card.red   .value { color: var(--red); }
    .stat-card.blue  .value { color: var(--blue); }
    .stat-card.purple .value { color: var(--accent2); }

    /* ── Table ── */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }

    thead th {
      background: var(--surface2);
      color: var(--muted);
      font-weight: 600;
      padding: 12px 16px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .15s;
    }

    tbody tr:hover { background: var(--surface2); }

    tbody td {
      padding: 12px 16px;
      color: var(--text);
      vertical-align: middle;
    }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: .75rem;
      font-weight: 600;
    }

    .badge-green  { background: rgba(34,197,94,.15);  color: var(--green); }
    .badge-red    { background: rgba(239,68,68,.15);  color: var(--red); }
    .badge-yellow { background: rgba(245,158,11,.15); color: var(--yellow); }
    .badge-blue   { background: rgba(59,130,246,.15); color: var(--blue); }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: flex-end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filter-group label {
      font-size: .78rem;
      color: var(--muted);
    }

    .filter-group input,
    .filter-group select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: .85rem;
      outline: none;
      transition: border-color .2s;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 9px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 600;
      transition: opacity .2s;
    }

    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger  { background: var(--red);    color: #fff; }
    .btn-sm { padding: 5px 12px; font-size: .78rem; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 48px;
      color: var(--muted);
    }

    .empty .icon { font-size: 2.5rem; margin-bottom: 12px; }

    /* ── Live dot ── */
    .live-dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      margin-left: 6px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-right: 0; padding: 16px; }
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar">
  <div class="sidebar-logo">
    <h1>⚡ EliteUniteTime</h1>
    <span>پنل مدیریت</span>
  </div>

  <a href="{{ url_for('index') }}"
     class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
    <span class="icon">🏠</span> داشبورد
  </a>
  <a href="{{ url_for('users') }}"
     class="nav-item {% if request.endpoint == 'users' %}active{% endif %}">
    <span class="icon">👥</span> کاربران
  </a>
  <a href="{{ url_for('reports') }}"
     class="nav-item {% if request.endpoint == 'reports' %}active{% endif %}">
    <span class="icon">📊</span> گزارش‌ها
  </a>
  <a href="{{ url_for('penalties') }}"
     class="nav-item {% if request.endpoint == 'penalties' %}active{% endif %}">
    <span class="icon">⚠️</span> تنبیهات
  </a>

  <div class="sidebar-footer">
    <a href="{{ url_for('logout') }}" class="logout-btn">🚪 خروج</a>
  </div>
</nav>

<!-- Main -->
<main class="main">
  {% block content %}{% endblock %}
</main>

{% block extra_scripts %}{% endblock %}
</body>
</html>
