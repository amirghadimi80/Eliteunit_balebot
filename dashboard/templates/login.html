<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود | EliteUniteTime</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0d12;
      --surface: #181c26;
      --border: #2a3044;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --red: #f43f5e;
    }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 70% 50% at 50% -20%, rgba(99,102,241,.15), transparent);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-wrap { width: 100%; max-width: 400px; }
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand .icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 8px 24px rgba(99,102,241,.35);
    }
    .login-brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .login-brand p {
      color: var(--muted);
      font-size: .88rem;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 26px;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      background: #0f1219;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: .95rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      margin-bottom: 20px;
    }
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    button {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--accent-hover); }
    .error {
      background: rgba(244,63,94,.1);
      border: 1px solid rgba(244,63,94,.25);
      color: var(--red);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: .85rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <div class="icon">⚡</div>
      <h1>EliteUniteTime</h1>
      <p>ورود به پنل مدیریت</p>
    </div>

    <div class="login-box">
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <label for="password">رمز عبور</label>
        <input type="password" id="password" name="password" placeholder="رمز عبور را وارد کنید" autofocus />
        <button type="submit">ورود</button>
      </form>
    </div>
  </div>
</body>
</html>
